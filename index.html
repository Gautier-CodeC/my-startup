<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCoach</title>
    <meta name="description" content="FinCoach aide les étudiants à gérer leur argent">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Banner -->
    <div class="banner">
        <div class="container">
            <h1>FinCoach</h1>
            <h2>L'appli qui aide les étudiants à gérer leur argent</h2>
            <a href="#form" class="btn-green">Je m'inscris</a>
        </div>
    </div>

    <!-- Cartes -->
    <div class="container">
        <h2 class="text-center">Ce que FinCoach t'apporte</h2>
        <div class="cards">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1758611973525-b5a86f468b5e?w=600&q=80&auto=format&fit=crop" alt="Apprendre">
                <h3>Apprendre</h3>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1533234944761-2f5337579079?w=600&q=80&auto=format&fit=crop" alt="Budget">
                <h3>Faire son budget</h3>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1642052502780-8ee67e3bf930?w=600&q=80&auto=format&fit=crop" alt="Investir">
                <h3>Investir</h3>
            </div>
        </div>
    </div>

    <!-- Fondateur -->
    <div class="container text-center">
        <h2>Le fondateur</h2>
        <img src="images/avatar.jpg" alt="Charles" class="avatar-large">
        <p>Charles Gautier, étudiant à Audencia Business School</p>
    </div>

    <!-- Typeform -->
    <div class="container text-center" id="form">
        <h2>Rejoins la liste d'attente</h2>
        <div data-tf-live="TON_ID_TYPEFORM"></div>
        <script src="//embed.typeform.com/next/embed.js"></script>
    </div>
</body>
</html>
